pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Flat directory holding the pre-built captchala.aar.
        flatDir { dirs "${rootDir}/app/libs" }
    }
}

rootProject.name = "captchala-demo"

include ':app'
